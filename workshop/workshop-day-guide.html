<style>
/* แผงควบคุมแบบหน้าปัดเครื่องมือ  รางเวลาด้านซ้าย  การ์ดรอบปัจจุบันด้านขวา */
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#0F1E2B; --muted:#5B6B7C;
  --line:#D2DAE4; --line-soft:#E4EAF1;
  --amber:#B85F0E; --amber-soft:#FBEDDC; --amber-line:#E8B277;
  --sage:#35694D; --sage-soft:#E2EFE8; --sage-line:#A6CBB6;
  --alert:#A72E22; --alert-soft:#FBE5E2;
  --navy:#17344C; --term:#6B5494; --term-soft:#F1ECFA; --term-line:#C7B8E4;
  --f-display:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
  --r:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--card);color:var(--ink);font-family:var(--f-body);
  font-size:18px;line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:30;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- แถบบน ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto;min-width:0}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand span{font-size:13.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--paper)}
.seg button{font:inherit;font-size:15.5px;font-family:var(--f-display);font-weight:600;
  border:0;background:transparent;color:var(--muted);padding:8px 18px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--card)}
.seg button:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

/* ---------- นาฬิกาจับเวลา ---------- */
.timer{display:flex;align-items:center;gap:8px}
.tdisp{font-family:var(--f-num);font-size:28px;font-weight:600;letter-spacing:.02em;
  min-width:96px;text-align:center;padding:2px 8px;border-radius:8px;
  border:1px solid var(--line);background:var(--paper)}
.tdisp.warn{color:var(--amber);border-color:var(--amber-line);background:var(--amber-soft)}
.tdisp.over{color:var(--alert);border-color:var(--alert);background:var(--alert-soft)}
.ico{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);
  color:var(--ink);width:42px;height:42px;border-radius:10px;display:grid;place-items:center;
  font-size:16px;font-family:var(--f-display);font-weight:600}
.ico:hover{border-color:var(--amber);color:var(--amber)}
.ico:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

/* ---------- โครงหลัก ---------- */
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);gap:30px;
  max-width:1440px;margin:0 auto;padding-block:22px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:860px){.wrap{grid-template-columns:1fr;gap:18px}}

/* ---------- รางเวลา ---------- */
.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);
  max-height:calc(100vh - 100px);overflow:auto;padding-bottom:56px}
@media (max-width:860px){.rail{position:static;max-height:none;padding-bottom:0}}
.rail h2{font-size:13.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  margin-bottom:8px;font-weight:600}
.rail ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
@media (max-width:860px){.rail ol{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:6px}}
.rl{width:100%;text-align:left;font:inherit;cursor:pointer;background:transparent;
  border:0;border-left:3px solid var(--line-soft);padding:7px 10px;border-radius:0 8px 8px 0;
  display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline;color:var(--muted)}
@media (max-width:860px){.rl{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid var(--line-soft);
  border-radius:8px 8px 0 0;grid-template-columns:auto auto}}
.rl time{font-family:var(--f-num);font-size:14px;letter-spacing:-.02em}
.rl span{font-family:var(--f-display);font-size:16.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.rl:hover{background:var(--line-soft);color:var(--ink)}
.rl[aria-current="true"]{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.rl[aria-current="true"] span{font-weight:700}
.rl.done{border-color:var(--sage-line)}
.rl.done time::after{content:" ✓";color:var(--sage)}
.rl.rest{opacity:.65;font-style:italic}
.rl:focus-visible{outline:2px solid var(--amber);outline-offset:-2px}

/* ---------- การ์ดรอบ ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.chead{padding:22px 26px 20px;border-bottom:1px solid var(--line-soft);
  display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.chead .t{min-width:0;flex:1 1 260px}
.chead time{font-family:var(--f-num);font-size:16.5px;color:var(--amber);font-weight:600;
  letter-spacing:.02em;display:block;margin-bottom:3px}
.chead h1{font-size:31px;font-weight:700;line-height:1.3}
.chead p{margin:8px 0 0;color:var(--muted);font-size:18px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-family:var(--f-display);font-size:14.5px;font-weight:600;padding:5px 12px;border-radius:999px;
  border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.sheet{border-color:var(--amber-line);color:var(--amber);background:var(--amber-soft)}
.tag.term{border-color:var(--term-line);color:var(--term);background:var(--term-soft);
  font-family:var(--f-display);letter-spacing:.01em}
.cbody{padding:22px 26px 26px;display:flex;flex-direction:column;gap:24px}

.sec>h3{font-family:var(--f-display);font-size:14px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin-bottom:9px}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:1px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr) auto;
  gap:14px;align-items:baseline;padding:12px 14px;border-radius:8px;background:var(--paper)}
ol.steps li::before{content:counter(s);font-family:var(--f-num);font-size:16px;font-weight:600;
  color:var(--card);background:var(--navy);width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;align-self:start;margin-top:1px}
ol.steps .who{display:block;font-size:15px;color:var(--muted);margin-top:2px}
ol.steps .mins{font-family:var(--f-num);font-size:15px;color:var(--muted);white-space:nowrap}
@media (max-width:520px){ol.steps li{grid-template-columns:24px minmax(0,1fr)}
  ol.steps .mins{grid-column:2;margin-top:-4px}}

blockquote.say{margin:0;padding:14px 16px;border-left:3px solid var(--amber);
  background:var(--amber-soft);border-radius:0 10px 10px 0;font-size:19px;line-height:1.65}
blockquote.say::before{content:"บทพูด";display:block;font-family:var(--f-display);font-size:13.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--amber);font-weight:700;margin-bottom:6px}
ul.watch{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
ul.watch li{padding-left:22px;position:relative;font-size:17.5px}
ul.watch li::before{content:"";position:absolute;left:3px;top:12px;width:8px;height:8px;
  border-radius:50%;background:var(--alert)}
dl.help{margin:0;display:flex;flex-direction:column;gap:10px}
dl.help div{background:var(--sage-soft);border:1px solid var(--sage-line);border-radius:8px;padding:11px 13px}
dl.help dt{font-family:var(--f-display);font-weight:600;font-size:17px;margin-bottom:3px}
dl.help dd{margin:0;font-size:17px;color:var(--ink);opacity:.92}
.stop{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;
  background:var(--alert-soft);border:1px solid var(--alert);font-size:17.5px}
.stop b{font-family:var(--f-display);color:var(--alert);white-space:nowrap}
.restcard{padding:30px 20px;text-align:center}
.restcard h1{font-size:30px}
.restcard p{color:var(--muted);margin:8px 0 0}

/* ---------- ปุ่มเดินหน้าถอยหลัง ---------- */
.nav{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
.nav button{font:inherit;font-family:var(--f-display);font-weight:600;font-size:17px;cursor:pointer;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:11px 20px;border-radius:10px}
.nav button.go{background:var(--navy);color:var(--card);border-color:var(--navy)}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:not(:disabled):hover{border-color:var(--amber)}
.nav button:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.nav .hint{font-size:14.5px;color:var(--muted);margin-left:auto}
.prog{height:5px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:14px}
.prog i{display:block;height:100%;background:var(--amber);transition:width .4s ease}
.credit{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));font-family:var(--f-display);
  font-size:14px;font-weight:600;letter-spacing:.01em;color:var(--muted);
  background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;backdrop-filter:blur(6px);pointer-events:none}
.credit b{color:var(--navy);font-weight:700}
@media (max-width:520px){.credit{font-size:10.5px;padding:4px 10px}}

.fade{animation:fade .34s ease both}
ol.steps li{animation:rise .3s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade,ol.steps li{animation:none}.prog i{transition:none}}
</style>

</div>

  ["ตารางที่ 6 ของชีต ค  แต่ละทีมเขียนก้าวแรก 1 ข้อ","ทั้งทีม","10 นาที"],
  ["ตัวแทนทีมละ 1 คนอ่านก้าวแรกของทีมออกเสียง","ตัวแทนทีม","5 นาที"],
  ["นัดติดตาม 1 ครั้ง ห่างจากวันนี้ 2 สัปดาห์ ความยาว 1 ชั่วโมง  บันทึกลงบรรทัดสุดท้าย","วิทยากร","2 นาที"]],
 say:"กฎจริงมี 4 ข้อ คือไม่ทำให้เป้าหมายรอบเสี่ยง คุณภาพห้ามลด ปรับแต่งคลังงานได้ และต่อรองขอบเขตกับ Product Owner ได้ ส่วนสลับออกไม่ใช่เพิ่มเข้า เป็นแค่สูตรจำง่ายที่มาจาก 4 ข้อนี้",
 watch:["ก้าวแรกต้องทำเสร็จได้ในวันจันทร์ และไม่ต้องขออนุมัติใคร",
        "ถ้าไม่นัดวันติดตามตรงนี้ จะไม่มีการติดตามเกิดขึ้นเลย"],
 help:[["ทีมคิดก้าวแรกไม่ออก","ย้ายคำขอที่ค้างในแชตและอีเมลของสัปดาห์ที่แล้วทั้งหมด ลงตารางที่ 3 ให้ครบ ใช้เวลาไม่เกิน 1 ชั่วโมง และไม่ต้องขอใคร"]],
 stop:"จบวัน ขอบคุณครับ"}
];

const $ = s => document.querySelector(s);
let cur = 0, trainer = false;
let tLeft = 0, tOn = false, tTick = null;

try{
  const a = localStorage.getItem('nyt-step'); if(a!==null) cur = Math.min(S.length-1, Math.max(0, +a||0));
  trainer = localStorage.getItem('nyt-mode') === 't';
}catch(e){}

function save(){ try{ localStorage.setItem('nyt-step', cur); localStorage.setItem('nyt-mode', trainer?'t':'s'); }catch(e){} }
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function rail(){
  $('#rail').innerHTML = S.map((s,i) =>
    `<li><button class="rl${s.rest?' rest':''}${i<cur?' done':''}" data-i="${i}"
      ${i===cur?'aria-current="true"':''}><time>${esc(s.t.split(' – ')[0])}</time><span>${esc(s.n)}</span></button></li>`
  ).join('');
}

function render(){
  const s = S[cur];
  let h;
  if(s.rest){
    h = `<div class="restcard fade"><time class="num" style="color:var(--amber);font-weight:600">${esc(s.t)}</time>
      <h1 style="margin-top:6px">${esc(s.n)}</h1><p>${esc(s.lead)}</p></div>`;
  }else{
    h = `<div class="chead fade"><div class="t"><time>${esc(s.t)}</time><h1>${esc(s.n)}</h1>
      <p>${esc(s.lead)}</p></div><div class="tags">
      <span class="tag sheet">ชีต ${esc(s.sheet)}</span><span class="tag">${s.dur} นาที</span>
      ${s.term ? `<span class="tag term">${esc(s.term)}</span>` : ''}</div></div>
      <div class="cbody">
      <section class="sec"><h3>ลำดับการทำ</h3><ol class="steps">${
        s.steps.map((x,i)=>`<li style="animation-delay:${i*45}ms"><div><b>${esc(x[0])}</b>
          <span class="who">${esc(x[1])}</span></div><span class="mins">${esc(x[2])}</span></li>`).join('')
      }</ol></section>`;
    if(trainer && s.say) h += `<section class="sec"><blockquote class="say">${esc(s.say)}</blockquote></section>`;
    if(trainer && s.watch) h += `<section class="sec"><h3>วิทยากรต้องเดินดู</h3><ul class="watch">${
      s.watch.map(w=>`<li>${esc(w)}</li>`).join('')}</ul></section>`;
    if(s.help) h += `<section class="sec"><h3>ถ้าติด ให้ทำแบบนี้ก่อนถามวิทยากร</h3><dl class="help">${
      s.help.map(p=>`<div><dt>${esc(p[0])}</dt><dd>${esc(p[1])}</dd></div>`).join('')}</dl></section>`;
    h += `<div class="stop"><b>หยุดตรงนี้</b><span>${esc(s.stop)}</span></div></div>`;
  }
  $('#card').innerHTML = h;
  $('#prev').disabled = cur === 0;
  $('#next').disabled = cur === S.length - 1;
  $('#prog').style.width = ((cur+1)/S.length*100).toFixed(1) + '%';
  rail();
  resetTimer();
  save();
}

function fmt(x){ const m = Math.floor(Math.abs(x)/60), s = Math.abs(x)%60;
  return (x<0?'-':'') + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0'); }
function paint(){
  const d = $('#tdisp');
  d.textContent = S[cur].dur ? fmt(tLeft) : '--:--';
  d.className = 'tdisp num' + (tLeft<0 ? ' over' : (tLeft<=120 ? ' warn' : ''));
}
function resetTimer(){ stopTimer(); tLeft = (S[cur].dur||0)*60; paint(); }
function stopTimer(){ tOn = false; clearInterval(tTick); tTick = null; $('#tgo').textContent = '▶'; }
function toggleTimer(){
  if(!S[cur].dur) return;
  if(tOn){ stopTimer(); return; }
  tOn = true; $('#tgo').textContent = '❚❚';
  tTick = setInterval(()=>{ tLeft--; paint(); }, 1000);
}

function setMode(t){
  trainer = t;
  $('#mTra').setAttribute('aria-pressed', t ? 'true' : 'false');
  $('#mStu').setAttribute('aria-pressed', t ? 'false' : 'true');
  render();
}
function go(i){ cur = Math.min(S.length-1, Math.max(0, i)); render(); window.scrollTo({top:0, behavior:'smooth'}); }

$('#prev').onclick = () => go(cur-1);
$('#next').onclick = () => go(cur+1);
$('#mTra').onclick = () => setMode(true);
$('#mStu').onclick = () => setMode(false);
$('#tgo').onclick = toggleTimer;
$('#trst').onclick = resetTimer;
$('#rail').onclick = e => { const b = e.target.closest('.rl'); if(b) go(+b.dataset.i); };
addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key === 'ArrowRight'){ e.preventDefault(); go(cur+1); }
  if(e.key === 'ArrowLeft'){ e.preventDefault(); go(cur-1); }
  if(e.key === ' '){ e.preventDefault(); toggleTimer(); }
});

setMode(trainer);
</script>

</body></html>
