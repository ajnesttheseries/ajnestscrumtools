<style>
:root{
  --paper:#EDF1F6; --card:#FFFFFF; --ink:#0F1E2B; --muted:#5B6B7C;
  --line:#D2DAE4; --line-soft:#E4EAF1; --grid:#C8D3DF;
  --amber:#B85F0E; --amber-soft:#FBEDDC; --amber-line:#E8B277;
  --sage:#35694D; --sage-soft:#E2EFE8; --sage-line:#A6CBB6;
  --alert:#A72E22; --alert-soft:#FBE5E2;
  --navy:#17344C; --blue:#1F4FD8; --blue-soft:#EEF3FF;
  --term:#6B5494; --term-soft:#F1ECFA; --term-line:#C7B8E4;
  --skin:#E8C9A8; --shirt:#2E6DA4;
  --calc-bg:#FFF9E8; --calc-line:#E0C97A; --calc-ink:#6E5512;
  --f-display:"IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif;
  --f-body:"Sarabun","IBM Plex Sans Thai",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0C141C; --card:#13222F; --ink:#E7EEF5; --muted:#92A6BA;
  --line:#243747; --line-soft:#1B2B3A; --grid:#2C4155;
  --amber:#E9A355; --amber-soft:#2C1E11; --amber-line:#6B4620;
  --sage:#7BBE9A; --sage-soft:#14271D; --sage-line:#2E5540;
  --alert:#E98578; --alert-soft:#2C1613;
  --navy:#9FC4E0; --blue:#86AEFF; --blue-soft:#15223B;
  --term:#C3ACE8; --term-soft:#241C33; --term-line:#4A3A6B;
  --skin:#C9A782; --shirt:#3E7FB8;
  --calc-bg:#2A2314; --calc-line:#6B5A26; --calc-ink:#E8D49A;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0C141C; --card:#13222F; --ink:#E7EEF5; --muted:#92A6BA;
  --line:#243747; --line-soft:#1B2B3A; --grid:#2C4155;
  --amber:#E9A355; --amber-soft:#2C1E11; --amber-line:#6B4620;
  --sage:#7BBE9A; --sage-soft:#14271D; --sage-line:#2E5540;
  --alert:#E98578; --alert-soft:#2C1613;
  --navy:#9FC4E0; --blue:#86AEFF; --blue-soft:#15223B;
  --term:#C3ACE8; --term-soft:#241C33; --term-line:#4A3A6B;
  --skin:#C9A782; --shirt:#3E7FB8;
  --calc-bg:#2A2314; --calc-line:#6B5A26; --calc-ink:#E8D49A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;
  line-height:1.6;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:var(--card)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- แถบบน ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--card);
  border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:9px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;margin:0 auto}
.brand{margin-right:auto;min-width:0}
.brand b{display:block;font-family:var(--f-display);font-size:15px;font-weight:700}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.ctl{display:flex;align-items:center;gap:7px}
button{font:inherit;cursor:pointer}
.ico{border:1px solid var(--line);background:var(--card);color:var(--ink);height:34px;
  min-width:34px;padding:0 10px;border-radius:9px;font-family:var(--f-display);
  font-weight:600;font-size:13px;display:inline-grid;place-items:center}
.ico:hover{border-color:var(--amber);color:var(--amber)}
.ico:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.ico.go{background:var(--navy);color:var(--card);border-color:var(--navy)}
.ico.go:hover{color:var(--card);opacity:.9}
.ico:disabled{opacity:.4;cursor:default}
.count{font-family:var(--f-num);font-size:13px;color:var(--muted);white-space:nowrap}

/* ---------- โครง ---------- */
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr) 270px;gap:18px;
  max-width:1440px;margin:0 auto;padding-block:16px 52px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:1180px){.wrap{grid-template-columns:minmax(0,1fr) 250px}.rail{display:none}}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}

/* ---------- รางขั้น ---------- */
.rail{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);
  max-height:calc(100vh - 90px);overflow:auto}
.rail h2{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:6px}
.rail ol{list-style:none;margin:0;padding:0}
.rl{width:100%;text-align:left;background:transparent;border:0;border-left:3px solid var(--line-soft);
  padding:5px 9px;border-radius:0 7px 7px 0;display:grid;grid-template-columns:20px 1fr;
  gap:7px;align-items:baseline;color:var(--muted)}
.rl i{font-family:var(--f-num);font-size:11px;font-style:normal}
.rl span{font-family:var(--f-display);font-size:12px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.rl:hover{background:var(--line-soft);color:var(--ink)}
.rl[aria-current="true"]{border-color:var(--amber);background:var(--amber-soft);color:var(--ink)}
.rl[aria-current="true"] span{font-weight:700}
.rl.done{border-color:var(--sage-line)}
.rl.setup i::after{content:" ·"}

/* ---------- กลาง  ชีตจำลอง ---------- */
.stage{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:7px 10px 0;background:var(--line-soft);overflow-x:auto}
.tab{font-family:var(--f-display);font-size:12px;font-weight:600;color:var(--muted);
  background:transparent;border:1px solid transparent;border-bottom:0;padding:5px 11px;
  border-radius:7px 7px 0 0;white-space:nowrap}
.tab.on{background:var(--card);color:var(--ink);border-color:var(--line)}
.shead{padding:12px 16px 10px;border-bottom:1px solid var(--line-soft)}
.shead .meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:5px}
.pill{font-family:var(--f-display);font-size:11px;font-weight:600;padding:3px 9px;
  border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.step{border-color:var(--amber-line);color:var(--amber);background:var(--amber-soft)}
.pill.term{border-color:var(--term-line);color:var(--term);background:var(--term-soft)}
.shead h1{font-size:19px;font-weight:700}
.shead p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.gridwrap{padding:14px 16px 16px;overflow-x:auto}
table{border-collapse:separate;border-spacing:0;font-size:12.5px;min-width:100%}
caption{caption-side:top;text-align:left;font-family:var(--f-display);font-size:12px;
  font-weight:600;color:var(--navy);padding-bottom:6px}
th{background:var(--navy);color:#fff;font-family:var(--f-display);font-weight:600;
  font-size:11.5px;padding:6px 8px;text-align:left;border:1px solid var(--navy);
  vertical-align:bottom;line-height:1.3}
td{padding:5px 8px;border:1px solid var(--grid);vertical-align:top;background:var(--card)}
td.n,th.n{text-align:center}
td.in{background:var(--blue-soft);color:var(--blue)}
td.fx{color:var(--ink);font-weight:600;background:var(--sage-soft)}
td.ro{color:var(--muted)}
td.hot{animation:pop .45s ease both}
td.hot::after{content:"";position:absolute}
tr.dim td{opacity:.45}
.cellnew{position:relative;display:inline-block;animation:typein .5s ease both}
.ring{box-shadow:inset 0 0 0 2px var(--amber);animation:ringpulse 1.2s ease-in-out 2}
@keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes typein{from{opacity:0;clip-path:inset(0 100% 0 0)}to{opacity:1;clip-path:inset(0)}}
@keyframes ringpulse{0%,100%{box-shadow:inset 0 0 0 2px var(--amber)}
  50%{box-shadow:inset 0 0 0 3px var(--amber),0 0 0 3px var(--amber-soft)}}
.calcbox{margin:12px 16px 0;padding:9px 12px;border-radius:8px;background:var(--calc-bg);
  border:1px solid var(--calc-line);color:var(--calc-ink);font-size:12.5px}
.calcbox b{font-family:var(--f-display)}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:0 16px 14px;font-size:11.5px;
  color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;
  vertical-align:-1px;border:1px solid var(--grid)}
.nav{display:flex;gap:9px;align-items:center;margin-top:13px;flex-wrap:wrap}
.nav .hint{font-size:11.5px;color:var(--muted);margin-left:auto}
.prog{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;margin-top:11px}
.prog i{display:block;height:100%;background:var(--amber);transition:width .35s ease}
.credit{position:fixed;z-index:25;left:max(14px,env(safe-area-inset-left,0px));
  bottom:max(12px,env(safe-area-inset-bottom,0px));font-family:var(--f-display);
  font-size:11.5px;font-weight:600;letter-spacing:.01em;color:var(--muted);
  background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);
  border-radius:999px;padding:5px 13px;backdrop-filter:blur(6px);pointer-events:none}
.credit b{color:var(--navy);font-weight:700}
@media (max-width:520px){.credit{font-size:10.5px;padding:4px 10px}}

/* ---------- ขวา  ตัวการ์ตูนและคำอธิบาย ---------- */
.side{display:flex;flex-direction:column;gap:12px;align-self:start;position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 60px)}
@media (max-width:820px){.side{position:static}}
.toon{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px;
  display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:end}
.toon svg{width:86px;height:104px;display:block}
.bubble{position:relative;background:var(--amber-soft);border:1px solid var(--amber-line);
  border-radius:11px;padding:8px 10px;font-size:13px;line-height:1.5;color:var(--ink)}
.bubble::before{content:"";position:absolute;left:-7px;bottom:14px;width:12px;height:12px;
  background:var(--amber-soft);border-left:1px solid var(--amber-line);
  border-bottom:1px solid var(--amber-line);transform:rotate(45deg)}
.who{font-size:11px;color:var(--muted);margin-top:4px;text-align:center;font-family:var(--f-display)}
.card2{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.card2 h3{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  font-weight:600;margin-bottom:5px}
.card2 p{margin:0 0 9px;font-size:13px}
.card2 p:last-child{margin-bottom:0}
.card2 .q{font-family:var(--f-display);font-weight:600;font-size:12.5px;color:var(--sage);
  margin-bottom:2px}
/* ตัวการ์ตูน */
#arm{transform-origin:68px 56px;transition:transform .45s ease}
.pose-point #arm{transform:rotate(-58deg)}
.pose-think #arm{transform:rotate(22deg)}
.pose-ok #arm{transform:rotate(-24deg)}
.pose-warn #arm{transform:rotate(-80deg)}
#brow{transition:transform .3s ease}
.pose-warn #brow,.pose-think #brow{transform:translateY(-2px)}
#mouth{transition:d .3s ease}
#blink{animation:blink 5.5s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
#toonG{animation:idle 3.4s ease-in-out infinite}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;
    transition-duration:.001s!important}
}
</style>

const GNAME = ['ตั้ง Scrum Team','ตั้ง Product Goal','สร้าง Product Backlog',
 'ตกลง Definition of Done','กำหนดความยาว Sprint','ขัดเกลา Backlog','ทำไมรอบนี้มีคุณค่า',
 'เลือกงานลงรอบนี้','จะทำอย่างไร','ขึ้นบอร์ด ปกป้อง Sprint Goal','Daily Scrum','เคลียร์อุปสรรค',
 'ตรวจผ่าน DoD','งานด่วนแทรก','ติดตาม Burndown','แสดง Increment','รับ Feedback',
 'Retrospective','เลือก 1-2 เรื่องมาทำ','วนรอบใหม่ + สรุป','เริ่ม Sprint 2'];
const TABS = ['ก','ข','รอบที่ 1','รอบที่ 2','ค','ง'];

/* ===== ตัวควบคุม ===== */
const $ = s => document.querySelector(s);
const esc = t => String(t).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let cur = 0, playing = false, timer = null, speed = 1;
const SPEEDS = [[1,'ปกติ',7000],[2,'ช้า',11000],[0,'เร็ว',4200]];
let spIdx = 0;

try{ const a = localStorage.getItem('nyt-fill'); if(a!==null) cur = Math.min(T.length-1,Math.max(0,+a||0)); }catch(e){}
const save = () => { try{ localStorage.setItem('nyt-fill', cur); }catch(e){} };

function rail(){
  const seen = new Set(T.slice(0, cur+1).map(x=>x.g));
  $('#rail').innerHTML = GNAME.map((n,i)=>{
    const g = i+1, first = T.findIndex(x=>x.g===g);
    const on = T[cur].g===g;
    return `<li><button class="rl${g<=5?' setup':''}${seen.has(g)&&!on?' done':''}"
      data-i="${first}" ${on?'aria-current="true"':''}><i>${g<=20?g:'→'}</i><span>${esc(n)}</span></button></li>`;
  }).join('');
}

function chart(vals){
  const W=560,H=150,P=26,max=Math.max(...vals),n=vals.length;
  const x=i=>P+i*(W-P*2)/(n-1), y=v=>H-P-(v/max)*(H-P*1.6);
  let d=`M${x(0)},${y(vals[0])}`;
  for(let i=1;i<n;i++){ d+=` H${x(i)} V${y(vals[i])}`; }
  const dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="var(--amber)"/>`).join('');
  const lbl=vals.map((v,i)=>`<text x="${x(i)}" y="${H-7}" text-anchor="middle" font-size="9"
      fill="var(--muted)" font-family="var(--f-num)">${i===0?'เริ่ม':i}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:560px;height:auto;margin-bottom:10px">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--grid)" stroke-width="1.5"/>
    <line x1="${P}" y1="14" x2="${P}" y2="${H-P}" stroke="var(--grid)" stroke-width="1.5"/>
    <line x1="${x(0)}" y1="${y(vals[0])}" x2="${x(n-1)}" y2="${y(0)}" stroke="var(--muted)"
      stroke-width="1.5" stroke-dasharray="5 4" opacity=".5"/>
    <path d="${d}" fill="none" stroke="var(--amber)" stroke-width="3" stroke-linejoin="round"
      pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease .2s forwards"/>
    ${dots}${lbl}
    <text x="${P-6}" y="${y(max)+4}" text-anchor="end" font-size="9" fill="var(--muted)"
      font-family="var(--f-num)">${max}</text></svg>
  <style>@keyframes draw{to{stroke-dashoffset:0}}</style>`;
}

function render(){
  const s = T[cur];
  $('#count').textContent = `${cur+1} / ${T.length}`;
  $('#tabs').innerHTML = TABS.map(t=>`<button class="tab${t===s.sh?' on':''}">ชีต ${esc(t)}</button>`).join('');
  $('#shead').innerHTML = `<div class="meta">
      <span class="pill step">${s.g<=20?'ขั้นที่ '+s.g+' จาก 20':'Sprint 2'}</span>
      <span class="pill">${esc(s.tb)}</span>
      ${s.term?`<span class="pill term">${esc(s.term)}</span>`:''}</div>
    <h1>${esc(s.h)}</h1><p>${esc(s.sub)}</p>`;

  let k = 0;
  const body = s.rows.map(r=>'<tr>'+r.map((c,ci)=>{
    let v = String(c), cls = 'ro';
    if(v.startsWith('+')){ v=v.slice(1); cls='in'; }
    else if(v.startsWith('=')){ v=v.slice(1); cls='fx'; }
    const narrow = (s.w[ci]||120) <= 120;
    const inner = (cls==='in'||cls==='fx') && v
      ? `<span class="cellnew" style="animation-delay:${(k++*0.12).toFixed(2)}s">${esc(v)}</span>`
      : esc(v);
    return `<td class="${cls}${narrow?' n':''}">${inner||'&nbsp;'}</td>`;
  }).join('')+'</tr>').join('');

  $('#grid').innerHTML = (s.chart?chart(s.chart):'') + `<table><caption>${esc(s.tb)}</caption>
    <thead><tr>${s.cols.map((c,i)=>`<th style="min-width:${s.w[i]||120}px"
      class="${(s.w[i]||120)<=120?'n':''}">${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${body}</tbody></table>`;

  $('#calc').innerHTML = s.calc
    ? `<div class="calcbox"><b>วิธีคำนวณ</b> &nbsp;${esc(s.calc)}</div>` : '';
  $('#say').textContent = s.say;
  $('#whoby').textContent = s.by || '';
  $('#toon').className = 'toon pose-' + (s.pose||'point');
  $('#info').innerHTML = (s.info&&s.info.length)
    ? '<h3>คำถามที่มักถาม</h3>' + s.info.map(q=>
        `<p><span class="q">${esc(q[0])}</span><br>${esc(q[1])}</p>`).join('')
    : '<h3>สรุปสั้น ๆ</h3><p>' + esc(s.sub) + '</p>';

  $('#prog').style.width = ((cur+1)/T.length*100).toFixed(1)+'%';
  for(const id of ['#prev','#prev2']) $(id).disabled = cur===0;
  for(const id of ['#next','#next2']) $(id).disabled = cur===T.length-1;
  rail(); save();
}

function go(i){
  cur = Math.min(T.length-1, Math.max(0, i));
  render();
  if(playing && cur===T.length-1) stop();
}
function tick(){ if(cur < T.length-1) go(cur+1); else stop(); }
function start(){
  if(cur===T.length-1) cur = 0;
  playing = true; $('#play').textContent = '❚❚ หยุด';
  clearInterval(timer); timer = setInterval(tick, SPEEDS[spIdx][2]);
  render();
}
function stop(){ playing = false; $('#play').textContent = '▶ เล่นอัตโนมัติ'; clearInterval(timer); }

$('#play').onclick = () => playing ? stop() : start();
$('#speed').onclick = e => {
  spIdx = (spIdx+1) % SPEEDS.length;
  e.currentTarget.textContent = SPEEDS[spIdx][1];
  if(playing){ clearInterval(timer); timer = setInterval(tick, SPEEDS[spIdx][2]); }
};
for(const id of ['#prev','#prev2']) $(id).onclick = () => { stop(); go(cur-1); };
for(const id of ['#next','#next2']) $(id).onclick = () => { stop(); go(cur+1); };
$('#rail').onclick = e => { const b = e.target.closest('.rl'); if(b){ stop(); go(+b.dataset.i); } };
addEventListener('keydown', e => {
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
  if(e.key==='ArrowRight'){ e.preventDefault(); stop(); go(cur+1); }
  if(e.key==='ArrowLeft'){ e.preventDefault(); stop(); go(cur-1); }
  if(e.key===' '){ e.preventDefault(); playing ? stop() : start(); }
});
render();
</script>
