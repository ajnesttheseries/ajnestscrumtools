<style>

.lb{font-size:28px;line-height:38px;font-weight:700;padding:4px 16px;border-radius:10px;background:#1f2c3a;color:#fff;white-space:nowrap;text-align:center}

.lb.n{background:none;color:#1f2c3a}
.lb.l{background:none;color:#fff}
.sw>div{position:absolute;left:0;right:0;top:4px;text-align:center}

.fi{opacity:0;animation:fi .6s ease var(--d,0s) both}
.fio{opacity:0}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr var(--u,1.5s) ease-in-out var(--d,0s) both}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes fo{from{opacity:1}to{opacity:0}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes redb{to{stroke:#ff3b3b}}

#nav button.c:hover{background:#101922}

<script>
/* =====================================================================
   เอนจิน: ทุกชิ้นบนเวทีคือ "actor" หนึ่งตัว มี @keyframes ของตัวเอง
   ที่สร้างจากไทม์ไลน์ [เวลาเริ่ม, ความยาว, ค่าที่เปลี่ยน] — เคลื่อนไหวด้วย CSS ล้วน

let L=[],CSS=[],uid=0,TT=20,caps=[],rl=null;
const MAP={o:'opacity',bg:'background-color',bc:'border-color',sh:'box-shadow',w:'width',h:'height'};
function css(s){
  let t=`transform:translate(${s.x}px,${s.y}px) rotate(${s.r}deg) scale(${s.s});opacity:${s.o};`;
  for(const k in s){ if(k=='x'||k=='y'||k=='s'||k=='r'||k=='o')continue; const v=s[k]; t+=`${MAP[k]||k}:${typeof v=='number'?v+'px':v};`; }
  return t;
}
function kfs(x,y,k,i){
  const s=Object.assign({x,y,s:1,r:0,o:0},i||{}), pts=[[0,css(s),'']]; let last=0;
  const add=(t,c,e)=>{const q=pts[pts.length-1]; if(Math.abs(q[0]-t)<1e-6){q[1]=c; if(e)q[2]=e;} else pts.push([t,c,e]);};
  (k||[]).slice().sort((a,b)=>a[0]-b[0]).forEach(([t0,d,p,e])=>{
    const t=Math.min(TT,Math.max(t0,last));
    add(t,css(s),e||'ease-in-out'); Object.assign(s,p); last=Math.min(TT,t+d); add(last,css(s),'');
  });
  add(TT,css(s),'');
  return pts.map(([t,c,e])=>`${(t/TT*100).toFixed(3)}%{${c}${e?'animation-timing-function:'+e:''}}`).join('');
}
function A(h,c,x,y,k,i,st){
  const n='k'+(uid++); CSS.push(`@keyframes ${n}{${kfs(x,y,k,i)}}`);
  L.push(`<div class="a ${c||''}" style="animation:${n} ${TT}s linear both;${st||''}">${h==null?'':h}</div>`);
}
function G(x,y,k,i,fn,st,c){ const save=L; L=[]; fn(); const inner=L.join(''); L=save; A(inner,c||'',x,y,k,i,st); }

const V={o:1};
const fin=(t,d=.7,p)=>[t,d,Object.assign({o:1},p)];
const fout=(t,d=.7,p)=>[t,d,Object.assign({o:0},p)];
const mv=(t,d,x,y,p)=>[t,d,Object.assign({x,y},p)];
function shake(t,x,n=6,amp=9,d=.09){const k=[];for(let j=0;j<n;j++)k.push([t+j*d,d,{x:x+(j%2?-amp:amp)}]);k.push([t+n*d,d,{x}]);return k;}
const fi=(t,h,st)=>`<div class="fi" style="--d:${t}s;${st||''}">${h}</div>`;
const fis=(t,h,st)=>`<span class="fi" style="--d:${t}s;${st||''}">${h}</span>`;
const fio=(a,b,h,st,d=.5)=>`<div class="fio" style="animation:fi ${d}s ease ${a}s both${b!=null?`,fo ${d}s ease ${b}s forwards`:''};${st||''}">${h}</div>`;

function psvg(c,f){return `<svg width="60" height="130" viewBox="0 0 60 130"><ellipse cx="30" cy="125" rx="24" ry="5" fill="rgba(0,0,0,.18)"/><rect x="18" y="80" width="10" height="44" rx="5" fill="#2b3440"/><rect x="32" y="80" width="10" height="44" rx="5" fill="#2b3440"/><path d="M12 52q0-14 18-14t18 14v32q0 5-5 5H17q-5 0-5-5z" fill="${c}"/><circle cx="30" cy="20" r="15" fill="#e6b890"/>${f?'<rect x="35" y="56" width="22" height="28" rx="3" fill="#f39a2e" stroke="#b86a10" stroke-width="2"/>':''}</svg>`;}
const P=(c,x,y,k,i)=>A(psvg(c),'',x,y,k,i);

function XX(x,y,sz,t,tout){A(XS(sz),'',x,y,[[t,.4,{o:1,s:1}]].concat(tout?[[tout,.5,{o:0}]]:[]),{s:.4});}
function SW(items,c,x,y,w,k,i,d){A(items.map(([a,b,h])=>fio(a,b,h,'',d||.4)).join(''),c+' sw',x,y,k,i,`width:${w}px;height:46px`);}
const ARW='<svg width="70" height="30"><path d="M3 15H54M42 4l14 11-14 11" stroke="#5b6b7c" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const IC2='<svg width="60" height="60"><rect x="10" y="8" width="40" height="48" rx="5" fill="#fff" stroke="#1f2c3a" stroke-width="4"/><path d="M18 22h24M18 32h24M18 42h14" stroke="#1f2c3a" stroke-width="4"/></svg>';
const IC3='<svg width="60" height="60"><path d="M6 30h22M28 30l20-16M28 30l20 16" stroke="#1f2c3a" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="50" cy="13" r="6" fill="#1f2c3a"/><circle cx="50" cy="47" r="6" fill="#1f2c3a"/></svg>';

/* ---------- บอร์ดงาน (ใช้ร่วมกันหลายขั้น) ---------- */
const BX=510,BY=50,BW=900,BH=500,CX=[524,812,1136],RY=i=>BY+78+i*64,PBY=i=>150+i*60;
const FULL='width:1920px;height:690px',BO=FULL+';transform-origin:960px 300px';
const SPR=['ยื่นคำขอ','ดูสถานะ','รีเซ็ตรหัส','แจ้งซ่อม','ยืมอุปกรณ์'];
const SPR4=['ยื่นคำขอ','ดูสถานะ','รีเซ็ตรหัส','ยืมอุปกรณ์'];
const PBN=['ขอสิทธิ์','คลังคำตอบ','แจ้งเตือน'];
function boardBase(){

  ['To Do','In Progress','Done'].forEach((h,j)=>A(h,'bh',CX[j],BY+14,[],V));

const GP=['ปล่อยของได้ทันกำหนด','ช่วยกันแก้บั๊กเร็ว','ใช้ของเดิมต่อยอด'];
const DP=['ประเมินขอบเขตพลาด','สื่อสารกับผู้ขายช้า','เนื้อหากับดีไซน์ไม่ไปด้วยกัน'];

  A('','bd',460,30,[],V,'width:1000px;height:420px'); A('','vl',958,50,[],V,'height:380px;width:4px');
  A('+','sym',680,34,[],V,'color:#1f9a55'); A('Δ','sym',1180,34,[],V,'color:#d9730d');
}

/* =====================================================================
   20 ขั้น
   ===================================================================== */
const SC=[
/* ---------- 1 ---------- */
{n:'ตั้ง Scrum Team',who:'ทีมถูกจัดตั้งขึ้น',T:29,f(){
  const D=7;
  const pp=[
    [NAVY,[-90,200],[640,470],[500,330],[470,330]],
    [NAVY,[2000,150],[1240,200],[410,330]],

/* =====================================================================
   ประกอบฉาก + ปุ่มควบคุม
   ===================================================================== */
function build(i){
  const s=SC[i]; L=[];CSS=[];uid=0;caps=[];rl=null;TT=s.T; s.f();
  caps.sort((a,b)=>a[0]-b[0]).forEach((c,j)=>{
    const k=[[c[0],.7,{o:1,y:738}]];
    if(caps[j+1])k.push([caps[j+1][0],.7,{y:694,o:.5}]);
    if(caps[j+2])k.push([caps[j+2][0],.3,{o:0}]);
    A(c[1],'cap',0,752,k);
  });
  if(rl)A(`<span>${rl[1]}</span>`,'rule',0,790,[[rl[0],.8,{o:1,s:1}]],{s:.92});
  return '<style>'+CSS.join('')+'</style>'+L.join('');
}
const PH=['ก่อน Sprint แรก','Refinement','Sprint Planning','ระหว่าง Sprint','Sprint Review','Retrospective','วนรอบใหม่'];
const phOf=i=>i<5?0:i<6?1:i<9?2:i<15?3:i<17?4:i<19?5:6;

if(typeof document!=='undefined'){
  const $=id=>document.getElementById(id), seen=new Set(); let cur=0;
  $('phase').innerHTML=PH.map(p=>`<div>${p}</div>`).join('');
  $('nav').innerHTML=SC.map((s,i)=>`<button class="s" data-i="${i}" title="${s.n}">${i+1}</button>`).join('')+
    '<button class="c" data-a="r">↺ เล่นซ้ำ</button><button class="c" data-a="p">◀ ย้อนกลับ</button><button class="c" data-a="n">ถัดไป ▶</button>';
  function show(i){
    cur=Math.max(0,Math.min(SC.length-1,i)); seen.add(cur);
    $('sc').innerHTML=build(cur);
    $('who').textContent=SC[cur].who;
    $('ttl').textContent=`ขั้น ${cur+1} / ${SC.length} · ${SC[cur].n}`;
    document.querySelectorAll('#nav .s').forEach((b,j)=>{b.className='s'+(j==cur?' cur':seen.has(j)?' seen':'');});
    document.querySelectorAll('#phase div').forEach((d,j)=>d.classList.toggle('on',j==phOf(cur)));
  }
  $('nav').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return; b.blur();
    if(b.dataset.i!=null)show(+b.dataset.i);
    else if(b.dataset.a=='r')show(cur); else if(b.dataset.a=='p')show(cur-1); else show(cur+1);
  });
  document.addEventListener('keydown',e=>{
    if(e.code=='Space'){e.preventDefault();show(cur);}
    else if(e.key=='ArrowRight'){e.preventDefault();show(cur+1);}
    else if(e.key=='ArrowLeft'){e.preventDefault();show(cur-1);}
  });
  function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('app').style.transform=`translate(-50%,-50%) scale(${s})`;}
  addEventListener('resize',fit); fit(); show(0);
}
</script>
