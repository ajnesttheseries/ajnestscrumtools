<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SDLC vs AIDLC — เข้าใจแนวคิด แล้วดูตัวอย่างจริง</title>
<style>
:root {
  --bg: #3b495c;
  --ink: #1c2633;
  --or: #f28c28;
  --bl: #4aa8e8;
  --gr: #2fb24a;
  --rd: #e03131;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: "Leelawadee UI", "Noto Sans Thai", "Sarabun", "Thonburi", Tahoma, sans-serif; color: #fff; }

#app { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; background: var(--bg); transform-origin: center; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 800px; overflow: hidden; }
#stage svg.main { position: absolute; left: 0; top: 0; width: 1600px; height: 800px; }
svg text { font-size: 28px; font-weight: 700; font-family: inherit; }

#title { position: absolute; right: 24px; top: 12px; font-size: 30px; font-weight: 700; z-index: 5; white-space: nowrap; }
#title .no { display: inline-block; background: rgba(20,28,40,.7); border-radius: 10px; padding: 0 14px; margin-right: 10px; }
#credit { position: absolute; right: 28px; top: 871px; font-size: 18px; line-height: 24px; font-weight: 400; color: rgba(255,255,255,.75); z-index: 5; white-space: nowrap; }

/* ---------- แถบล่าง ---------- */
#nav { position: absolute; left: 0; top: 800px; width: 1600px; height: 100px; background: #2b3645; display: flex; align-items: flex-start; gap: 8px; padding: 7px 28px 0; }
#nav button { font: inherit; font-size: 24px; font-weight: 700; color: #fff; border: 0; border-radius: 12px; height: 62px; cursor: pointer; background: #6f7f93; }
#nav .num { width: 46px; }
#nav .num.seen { background: #3a3f47; }
#nav .num.cur { background: var(--gr); }
#nav .lab { font-size: 20px; line-height: 62px; color: #c9d3df; margin: 0 2px 0 8px; white-space: nowrap; }
#nav .lab:first-child { margin-left: 0; }
#nav .act { padding: 0 22px; background: #4d5d72; font-size: 26px; }
#nav .act:hover, #nav .num:hover { filter: brightness(1.15); }
#nav .sp { flex: 1; }

/* ---------- ชิ้นส่วน HTML บนเวที ---------- */
.tag { position: absolute; translate: -50% 0; white-space: nowrap; font-size: 28px; font-weight: 700; line-height: 1.45; padding: 1px 16px; border-radius: 10px; background: rgba(20,28,40,.88); text-align: center; }
.tag.tl { translate: 0 0; }
.tag.tr { translate: -100% 0; }
.tag.sm { font-size: 24px; font-weight: 400; }
.tag.flag { background: #fff; color: var(--ink); border: 3px solid var(--ink); }
.tag.warn { background: #ffe066; color: var(--ink); }
.tag.ok { background: #2fe05a; color: var(--ink); }
.tag.bad { background: #ff4d4d; color: #fff; }
.chip { display: inline-block; padding: 0 10px; border-radius: 8px; font-weight: 700; color: #fff; }
.cap { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; white-space: nowrap; font-size: 30px; font-weight: 600; line-height: 1.5; padding: 3px 22px; border-radius: 12px; background: rgba(20,28,40,.9); opacity: 0; }
.cnt { position: absolute; width: 320px; height: 96px; font-size: 64px; font-weight: 800; line-height: 96px; white-space: nowrap; }
.cnt span { position: absolute; left: 0; top: 0; opacity: 0; }
.plain { position: absolute; font-size: 28px; font-weight: 700; white-space: nowrap; }
.panel { position: absolute; padding: 8px 16px 10px; background: rgba(20,28,40,.94); border: 3px solid #8fa0b5; border-radius: 14px; text-align: center; font-size: 22px; line-height: 1.35; }
.panel .ph { font-weight: 700; line-height: 38px; }
.panel .body { font-weight: 400; }
.closing { position: absolute; left: 50%; bottom: 6px; translate: -50% 0; text-align: center; }
.closing div { margin: 0 auto 4px; width: max-content; white-space: nowrap; font-size: 28px; line-height: 38px; padding: 0 20px; border-radius: 10px; background: rgba(20,28,40,.92); }
.closing .last { color: #ffe066; font-weight: 700; }

/* ---------- แอนิเมชัน ---------- */
.mv { transform: translate(var(--x0, 0px), var(--y0, 0px)); }
@keyframes m1 { from { transform: translate(var(--x0), var(--y0)); } to { transform: translate(var(--x1), var(--y1)); } }
@keyframes m2 { from { transform: translate(var(--x1), var(--y1)); } to { transform: translate(var(--x2), var(--y2)); } }
@keyframes m3 { from { transform: translate(var(--x2), var(--y2)); } to { transform: translate(var(--x3), var(--y3)); } }
@keyframes m4 { from { transform: translate(var(--x3), var(--y3)); } to { transform: translate(var(--x4), var(--y4)); } }
@keyframes fi { from { opacity: 0; } to { opacity: 1; } }
@keyframes fo { to { opacity: 0; } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@keyframes hop { 0%, 100% { translate: 0 0; } 40% { translate: 0 -16px; } }
@keyframes swA { 0%, 100% { rotate: 0deg; } 25% { rotate: 16deg; } 75% { rotate: -16deg; } }
@keyframes swB { 0%, 100% { rotate: 0deg; } 25% { rotate: -16deg; } 75% { rotate: 16deg; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
@keyframes toGreen { to { fill: #3ddc5f; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes capIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes capUp { from { opacity: 1; transform: none; } to { opacity: .55; transform: translateY(-56px); } }
@keyframes capUpK { from { opacity: 1; transform: none; } to { opacity: 1; transform: translateY(-56px); } }
@keyframes capOut { from { opacity: .55; transform: translateY(-56px); } to { opacity: 0; transform: translateY(-92px); } }
@keyframes ripple { 0% { opacity: 0; transform: scale(.2); } 12% { opacity: .95; } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes gather { from { transform: translate(var(--fx), var(--fy)) scale(1.9); } to { transform: translate(0, 0) scale(1); } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
@keyframes glow { 0%, 100% { stroke-width: 4; } 50% { stroke-width: 10; } }
.gy { transform-box: fill-box; transform-origin: 50% 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="title"></div>
  <div id="stage"></div>
  <div id="credit">Aj. NesT the Series</div>
  <div id="nav"></div>
</div>

<script>
/* ===== ค่ากลาง ===== */
const C = { or: '#f28c28', bl: '#4aa8e8', gr: '#2fb24a', gr2: '#3ddc5f', rd: '#e03131', ink: '#1c2633', note: '#ffe066', pur: '#8e5bd0', grey: '#c9d3df' };
const P = { po: '#1f3a6e', g: '#2f9e44', y: '#f2c230', r: '#e8504f', sm: '#8e5bd0', ds: '#2a7fb8', de: '#7b61ff' };

/* ===== ตัวช่วยสร้างชิ้นส่วน ===== */
function A(o) {
  const v = [], a = [];
  (o.p || []).forEach((s, i) => {
    v.push(`--x${i}:${s[0]}px;--y${i}:${s[1]}px`);
    if (i) a.push(`m${i} ${s[3] || 1.4}s ${s[4] || 'ease-in-out'} ${s[2]}s forwards`);
  });
  if (o.in != null) a.push(`fi ${o.ind || .8}s ease ${o.in}s both`);
  if (o.out != null) a.push(`fo ${o.outd || .8}s ease ${o.out}s forwards`);
  if (o.a) a.push(o.a);
  return `class="mv" style="${v.join(';')}${o.s ? ';' + o.s : ''}${a.length ? ';animation:' + a.join(',') : ''}"`;
}
const an = a => a.length ? ` style="animation:${a.join(',')}"` : '';

function person(col, p, o = {}) {
  const ba = [], la = [], lb = [];
  p.forEach((s, i) => {
    if (!i) return;
    const d = s[3] || 1.4, n = Math.max(2, Math.round(d / .5));
    ba.push(`bob .5s ease-in-out ${s[2]}s ${n}`);
    la.push(`swA .5s linear ${s[2]}s ${n}`);
    lb.push(`swB .5s linear ${s[2]}s ${n}`);
  });
  (o.hop || []).forEach(t => ba.push(`hop .6s ease-out ${t}s 1`));
  const folder = o.folder
    ? `<rect x="-47" y="-98" width="30" height="40" rx="3" fill="${C.or}" stroke="#b8650f" stroke-width="2"/><rect x="-47" y="-98" width="13" height="6" fill="#b8650f"/>` : '';
  const laptop = o.laptop
    ? `<rect x="-30" y="-92" width="60" height="6" rx="2" fill="#27303c"/><rect x="-26" y="-126" width="52" height="34" rx="3" fill="#27303c"/><rect x="-22" y="-122" width="44" height="26" fill="${C.bl}"/>` : '';
  return `<g ${A({ p, in: o.in, out: o.out })}><ellipse cx="0" cy="2" rx="32" ry="9" fill="rgba(0,0,0,.18)"/><g${an(ba)}>
    <g transform="translate(-9,-54)"><rect x="-7" y="0" width="14" height="54" rx="6" fill="#27303c"${an(la)}/></g>
    <g transform="translate(9,-54)"><rect x="-7" y="0" width="14" height="54" rx="6" fill="#27303c"${an(lb)}/></g>
    <rect x="-36" y="-118" width="12" height="50" rx="6" fill="${col}"/><rect x="24" y="-118" width="12" height="50" rx="6" fill="${col}"/>
    <rect x="-25" y="-122" width="50" height="74" rx="12" fill="${col}"/>
    <circle cx="0" cy="-142" r="17" fill="#ecd3bd"/>${folder}${laptop}</g></g>`;
}

function card(o) {
  const w = o.w || 280, h = o.h || 46, tc = o.tc || C.ink, fs = o.fs || 28;
  const rs = o.re ? ` style="animation:${o.re.map(r => `${r[0]} .6s ease ${r[1]}s forwards`).join(',')}"` : '';
  const t = o.txt == null ? '' : `<text x="${w / 2}" y="${h / 2 + fs * .36}" text-anchor="middle" fill="${tc}" style="font-size:${fs}px">${o.txt}</text>`;
  return `<g ${A(o)}><g${o.inner ? ` style="${o.inner}"` : ''}><rect width="${w}" height="${h}" rx="8" fill="${o.fill || C.or}" stroke="rgba(0,0,0,.28)" stroke-width="1.5"${rs}/>${t}</g></g>`;
}

const tag = (x, y, html, t, cls = '') => `<div class="tag ${cls}" style="left:${x}px;top:${y}px${t == null ? '' : `;animation:rise .9s ease ${t}s both`}">${html}</div>`;
function caps(list) {
  return list.map((c, i) => {
    const a = [`capIn .9s ease ${c[0]}s both`];
    if (list[i + 1]) a.push(`${c[2] ? 'capUpK' : 'capUp'} .9s ease ${list[i + 1][0]}s forwards`);
    if (list[i + 2]) a.push(`capOut .9s ease ${list[i + 2][0]}s forwards`);
    return `<div class="cap" style="animation:${a.join(',')}">${c[1]}</div>`;
  }).join('');
}
const S = (svg, html = '') => `<svg class="main" viewBox="0 0 1600 800">${svg}</svg>${html}`;
const drawn = (t, dur = 1, ease = 'ease-in-out') => `pathLength="1" style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw ${dur}s ${ease} ${t}s forwards"`;
const txt = (x, y, s, o = {}) => `<text x="${x}" y="${y}" fill="${o.fill || '#fff'}" text-anchor="${o.anchor || 'start'}" style="font-size:${o.fs || 26}px;font-weight:${o.fw || 400}${o.t != null ? `;animation:fi .7s ease ${o.t}s both` : ''}">${s}</text>`;
const rise = (t, inner) => `<g style="animation:rise .8s ease ${t}s both">${inner}</g>`;
const popAt = (x, y, t, inner) => `<g transform="translate(${x},${y})"><g style="animation:pop .6s cubic-bezier(.3,1.5,.5,1) ${t}s both">${inner}</g></g>`;

/* กล่องข้อความ 1–2 บรรทัด */
const bx = (x, y, w, h, l1, l2, o = {}) => {
  const tc = o.tc || C.ink, fs1 = o.fs1 || 24, fs2 = o.fs2 || 20;
  const y1 = l2 ? y + h / 2 - 5 : y + h / 2 + fs1 * .36;
  const body = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx || 12}" fill="${o.fill || '#fff'}" stroke="${o.stroke || 'rgba(0,0,0,.25)'}" stroke-width="${o.sw || 2}"/>` +
    txt(x + w / 2, y1, l1, { anchor: 'middle', fs: fs1, fw: 700, fill: tc }) +
    (l2 ? txt(x + w / 2, y + h / 2 + fs2 + 4, l2, { anchor: 'middle', fs: fs2, fill: o.tc2 || tc }) : '');
  return o.t != null ? rise(o.t, body) : body;
};

/* สองแผงเทียบ ซ้าย SDLC / ขวา AIDLC */
const panels = (ls, rs, h = 550) => `<rect x="40" y="90" width="730" height="${h}" rx="18" fill="#2e3a4b" stroke="${C.or}" stroke-width="4"/><rect x="830" y="90" width="730" height="${h}" rx="18" fill="#2e3a4b" stroke="${C.bl}" stroke-width="4"/>
  <text x="405" y="140" text-anchor="middle" fill="${C.or}" style="font-size:34px">SDLC · ${ls}</text><text x="1195" y="140" text-anchor="middle" fill="${C.bl}" style="font-size:34px">AIDLC · ${rs}</text>`;
const stepTag = (n, name) => tag(800, 12, `ขั้นที่ ${n} / 6 · ${name}`, .2, 'flag');
const qTag = (n, q) => tag(800, 12, `คำถามที่ ${n} / 7 · ${q}`, .2, 'flag');
const mini = (col, x, y, o = {}) => `<g transform="translate(${x},${y}) scale(.62)">${person(col, [[0, 0]], o)}</g>`;
const check = (x, y, t, col = '#2fe05a') => popAt(x, y, t, `<circle r="22" fill="${col}"/><path d="M-10,0 l7,8 l14,-16" stroke="${C.ink}" stroke-width="5" fill="none" stroke-linecap="round"/>`);
const warn = (x, y, t) => popAt(x, y, t, `<polygon points="0,-24 24,20 -24,20" fill="#ffe066" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/><text x="0" y="14" text-anchor="middle" fill="${C.ink}" style="font-size:26px">!</text>`);
const arDef = (col = '#ffe066') => `<defs><marker id="ar" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0,0 L16,8 L0,16 z" fill="${col}"/></marker></defs>`;
const arw = (d, t, col = '#ffe066', w = 4) => `<g style="animation:fi .2s ease ${t}s both"><path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" marker-end="url(#ar)" ${drawn(t, .6)}/></g>`;

/* ================================================================
   ส่วนที่ 1 · แนวคิด (8 ฉาก)   ส่วนที่ 2 · ตัวอย่างจริง (10 ฉาก)
   ================================================================ */
const SCENES = [

/* 1 ภาพรวม — อินโฟกราฟิกประกอบทีละชิ้น */
{ name: 'ภาพรวม SDLC vs AIDLC', build: () => {
  const L = [['Requirements Gathering', 'เก็บและวิเคราะห์ความต้องการ'], ['System Architecture & Design', 'ออกแบบสถาปัตยกรรมระบบ'],
    [['Overall Architecture', 'ภาพรวมระบบ'], ['Module Design', 'ออกแบบโมดูลย่อย']], ['Implementation', 'ลงมือเขียนโค้ด'],
    ['Quality Assurance & Testing', 'ทดสอบคุณภาพ'], [['Unit Testing', 'ทดสอบทีละหน่วย'], ['Integration Testing', 'ทดสอบการเชื่อมต่อ']],
    ['Release & Deployment', 'ปล่อยใช้งาน'], ['Maintenance & Enhancements', 'ดูแลและปรับปรุง']];
  const R = [['Problem Framing & Use Case', 'ตั้งโจทย์ เลือก Use case'], ['Data Acquisition & Preparation', 'จัดหาและเตรียมข้อมูล'],
    [['Data Collection', 'เก็บข้อมูล'], ['Cleaning & Annotation', 'ทำความสะอาด ติดป้าย']], ['Model Building', 'สร้างโมเดล'],
    ['Training, Testing & Evaluation', 'ฝึก ทดสอบ ประเมินผล'], [['Model Training', 'กระบวนการฝึก'], ['Performance Validation', 'วัดและยืนยันผล']],
    ['Deployment & Monitoring', 'ปล่อยใช้ และเฝ้าดูผล'], ['Continuous Improvement', 'ปรับปรุงโมเดลต่อเนื่อง']];
  const RY = k => 120 + k * 68;
  const box = (cx, cy, w, en, th, color, br, t) => popAt(cx, cy, t,
    `<rect x="${-w / 2}" y="-28" width="${w}" height="56" rx="${br ? 10 : 28}" fill="#fff" stroke="${color}" stroke-width="3"${br ? ' stroke-dasharray="8 5"' : ''}/>` +
    txt(0, -3, en, { anchor: 'middle', fs: br ? 18 : 20, fw: 700, fill: C.ink }) + txt(0, 20, th, { anchor: 'middle', fs: br ? 16 : 17, fill: '#5b6b7d' }));
  const col = (rows, cx, color, title, t0) => {
    let s = `<rect x="${cx - 370}" y="64" width="740" height="606" rx="18" fill="#f4f1ec" stroke="${color}" stroke-width="4" style="animation:fi .6s ease ${t0 - .5}s both"/>` +
      txt(cx, 104, title, { anchor: 'middle', fs: 32, fw: 800, fill: color, t: t0 - .4 }) +
      `<line x1="${cx}" y1="118" x2="${cx}" y2="${RY(7) + 30}" stroke="${color}" stroke-width="5" ${drawn(t0, 4.8, 'linear')}/>`;
    rows.forEach((r, k) => {
      const y = RY(k) + 28, t = t0 + .2 + k * .6;
      if (Array.isArray(r[0])) r.forEach((b, j) => {
        s += `<line x1="${j ? cx : cx - 18}" y1="${y}" x2="${j ? cx + 18 : cx}" y2="${y}" stroke="${color}" stroke-width="4" style="animation:fi .3s ease ${t}s both"/>`;
        s += box(j ? cx + 168 : cx - 168, y, 300, b[0], b[1], color, true, t + j * .15);
      });
      else s += box(cx, y, 360, r[0], r[1], color, false, t);
    });
    return s;
  };
  let pair = '';
  for (let k = 0; k < 8; k++) {
    const t = 11.4 + k * .45, y = RY(k);
    [410, 1190].forEach(cx => pair += `<rect x="${cx - 345}" y="${y - 4}" width="690" height="64" rx="16" fill="none" stroke="#ffe066" stroke-width="5" style="opacity:0;animation:fi .25s ease ${t}s forwards,fo .5s ease ${t + .8}s forwards"/>`);
    pair += popAt(800, y + 28, t, `<circle r="15" fill="#ffe066"/><text x="0" y="8" text-anchor="middle" fill="${C.ink}" style="font-size:22px">≈</text>`);
  }
  return S(col(L, 410, C.or, 'SDLC · วงจรพัฒนาซอฟต์แวร์', .8) + col(R, 1190, C.bl, 'AIDLC · วงจรพัฒนาระบบ AI', 6.2) + pair,
    `<div class="plain" style="left:24px;top:20px;font-size:18px;font-weight:400;color:#c9d3df;animation:fi 1s ease .4s both">ดัดแปลงจากอินโฟกราฟิกของ Sivasankar Natarajan</div>` +
    caps([[1, 'SDLC — วงจรพัฒนาซอฟต์แวร์: จากความต้องการ จนถึงดูแลหลังใช้งาน'], [6.4, 'AIDLC — วงจรพัฒนาระบบ AI: จากโจทย์ → ข้อมูล → โมเดล → ปรับปรุงต่อเนื่อง'],
      [11.6, 'จับคู่กันได้ทีละขั้น — แต่ของที่ไหลอยู่ข้างในต่างกัน: โค้ด vs ข้อมูล'], [16, 'ภาพนี้ยังขาด 2 อย่าง: ลูกศรวนกลับ และกรอบธรรมาภิบาล — เติมให้ในฉาก 16']]));
} },

/* 2 คืออะไร */
{ name: 'คืออะไร', build: () => {
  const nm = (y, col, ab, full, th, t) => rise(t, `<rect x="40" y="${y}" width="340" height="170" rx="16" fill="#2e3a4b" stroke="${col}" stroke-width="4"/>${txt(210, y + 62, ab, { anchor: 'middle', fs: 48, fw: 800, fill: col })}${txt(210, y + 100, full, { anchor: 'middle', fs: 19, fill: C.grey })}${txt(210, y + 142, th, { anchor: 'middle', fs: 26, fw: 700 })}`);
  const A0 = 90, B0 = 320;
  const lane = (y0, o) =>
    bx(430, y0 + 2, 330, 72, o[0][0], o[0][1], { t: o.t }) +
    bx(430, y0 + 92, 330, 72, o[1][0], o[1][1], { t: o.t + .7, fill: o.f2, tc: o.tc2 || C.ink }) +
    arw(`M762,${y0 + 38} C790,${y0 + 38} 790,${y0 + 83} 814,${y0 + 83}`, o.t + 1.5) +
    arw(`M762,${y0 + 128} C790,${y0 + 128} 790,${y0 + 83} 814,${y0 + 83}`, o.t + 1.5) +
    bx(820, y0 + 47, 220, 72, o[2][0], o[2][1], { t: o.t + 2, fill: C.grey }) +
    arw(`M1042,${y0 + 83} H1094`, o.t + 2.6) +
    bx(1100, y0 + 47, 450, 72, o[3][0], o[3][1], { t: o.t + 3, fill: o.f4 });
  return S(arDef() +
    nm(A0, C.or, 'SDLC', 'Software Development Life Cycle', 'วงจรพัฒนาซอฟต์แวร์', .5) +

/* 16 วงจรวนซ้ำ + ธรรมาภิบาล */
{ name: 'วงจรวนซ้ำ + ธรรมาภิบาล', build: () => {

  let nodes = '', tags = '';

    const col = k === 0 ? C.note : k === 7 ? '#8fa0b5' : '#fff';
    nodes += `<g transform="translate(${x},${y})"><g style="--fx:${from[k][0] - x}px;--fy:${from[k][1] - y}px;animation:gather 2s ease-in-out .4s both"><circle r="34" fill="${col}" stroke="${ink}" stroke-width="4"/>${txt(0, 11, k, { fill: ink, anchor: 'middle', fs: 30, fw: 800 })}</g></g>`;

      [9.6, 'ธรรมาภิบาลไม่ใช่ขั้นสุดท้าย — แต่เป็นกรอบที่ครอบทุกขั้น'], [13.4, 'และต้องมีวันปลดระวาง — โมเดลที่ไม่มีใครดูแลคือความเสี่ยง']]));

    tag(800, 272, 'Prompt → RAG → Fine-tune: เริ่มจากทางที่ถูกและเร็วที่สุดก่อน', 4.8, 'warn sm') +

/* ===== ตัวควบคุมฉาก ===== */
const stage = document.getElementById('stage'), title = document.getElementById('title'), nav = document.getElementById('nav'), app = document.getElementById('app');
const seen = new Set();
let cur = 0;
const GROUPS = [['แนวคิด', 0, 8], ['ตัวอย่างจริง', 8, SCENES.length]];
const nums = [];
GROUPS.forEach(g => {
  const l = document.createElement('span'); l.className = 'lab'; l.textContent = g[0]; nav.appendChild(l);
  for (let i = g[1]; i < g[2]; i++) {
    const b = document.createElement('button');
    b.className = 'num'; b.textContent = i + 1; b.title = SCENES[i].name;
    b.onclick = () => { show(i); b.blur(); };
    nav.appendChild(b); nums.push(b);
  }
});
nav.insertAdjacentHTML('beforeend', '<span class="sp"></span><button class="act" id="bR">เล่นซ้ำ</button><button class="act" id="bP" title="ย้อนกลับ">‹</button><button class="act" id="bN" title="ถัดไป">›</button>');

function show(i) {
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  seen.add(cur);
  stage.innerHTML = SCENES[cur].build();   // สร้างใหม่ทุกครั้ง = แอนิเมชันเริ่มจากต้น แล้วค้างภาพสุดท้าย
  title.innerHTML = `<span class="no">${cur + 1} / ${SCENES.length}</span>${SCENES[cur].name}`;
  nums.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('seen', k !== cur && seen.has(k)); });
}
document.getElementById('bR').onclick = e => { show(cur); e.currentTarget.blur(); };
document.getElementById('bP').onclick = e => { show(cur - 1); e.currentTarget.blur(); };
document.getElementById('bN').onclick = e => { show(cur + 1); e.currentTarget.blur(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); show(cur); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
});
function fit() { app.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener('resize', fit);
fit();
show(0);
</script>
</body>
