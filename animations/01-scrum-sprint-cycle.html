<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrum หนึ่งรอบ Sprint — สื่อสอนแบบแอนิเมชัน</title>
<style>
@property --m { syntax: '<integer>'; inherits: false; initial-value: 15; }
@property --s { syntax: '<integer>'; inherits: false; initial-value: 0; }

:root {
  --bg: #3b495c;
  --ink: #1c2633;
  --or: #f28c28;
  --bl: #4aa8e8;
  --gr: #2fb24a;
  --rd: #e03131;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: "Leelawadee UI", "Noto Sans Thai", "Sarabun", "Thonburi", Tahoma, sans-serif; color: #fff; }

#app { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; background: var(--bg); transform-origin: center; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 800px; overflow: hidden; }
#stage svg.main { position: absolute; left: 0; top: 0; width: 1600px; height: 800px; }
svg text { font-size: 28px; font-weight: 700; font-family: inherit; }

#title { position: absolute; right: 24px; top: 12px; font-size: 30px; font-weight: 700; z-index: 5; white-space: nowrap; }
#title .no { display: inline-block; background: rgba(20,28,40,.7); border-radius: 10px; padding: 0 14px; margin-right: 10px; }

#credit { position: absolute; right: 28px; top: 871px; font-size: 18px; line-height: 24px; font-weight: 400; color: rgba(255,255,255,.75); z-index: 5; white-space: nowrap; }

/* ---------- แถบล่าง ---------- */
#nav { position: absolute; left: 0; top: 800px; width: 1600px; height: 100px; background: #2b3645; display: flex; align-items: flex-start; gap: 12px; padding: 7px 28px 0; }
#nav button { font: inherit; font-size: 28px; font-weight: 700; color: #fff; border: 0; border-radius: 12px; height: 62px; cursor: pointer; background: #6f7f93; }
#nav .num { width: 62px; }
#nav .num.seen { background: #3a3f47; }
#nav .num.cur { background: var(--gr); }
#nav .act { padding: 0 26px; background: #4d5d72; }
#nav .act:hover, #nav .num:hover { filter: brightness(1.15); }
#nav .sp { flex: 1; }

/* ---------- ชิ้นส่วน HTML บนเวที ---------- */
.tag { position: absolute; translate: -50% 0; white-space: nowrap; font-size: 28px; font-weight: 700; line-height: 1.45; padding: 1px 16px; border-radius: 10px; background: rgba(20,28,40,.88); text-align: center; }
.tag.tl { translate: 0 0; }
.tag.tr { translate: -100% 0; }
.tag.two { font-weight: 400; padding: 6px 18px; }
.tag.flag { background: #fff; color: var(--ink); border: 3px solid var(--ink); }
.chip { display: inline-block; padding: 0 12px; border-radius: 8px; font-weight: 700; color: #fff; }
.cap { position: absolute; left: 50%; bottom: 14px; translate: -50% 0; white-space: nowrap; font-size: 30px; font-weight: 600; line-height: 1.5; padding: 3px 22px; border-radius: 12px; background: rgba(20,28,40,.9); opacity: 0; }
.cnt { position: absolute; width: 180px; height: 96px; font-size: 76px; font-weight: 800; line-height: 96px; }
.cnt span { position: absolute; left: 0; top: 0; opacity: 0; }
.plain { position: absolute; font-size: 28px; font-weight: 700; white-space: nowrap; }
.timer { font-size: 64px; line-height: 1.3; padding: 0 22px; border: 4px solid #fff; }
.tm { --m: 15; --s: 0; counter-reset: m var(--m) s var(--s); }
.tm::after { content: counter(m, decimal-leading-zero) ":" counter(s, decimal-leading-zero); }
.panel { position: absolute; padding: 8px 10px 10px; background: rgba(20,28,40,.94); border: 3px solid #8fa0b5; border-radius: 14px; text-align: center; font-size: 28px; line-height: 1.32; }
.panel .ph { font-weight: 700; line-height: 40px; }
.panel .no { display: inline-block; width: 36px; height: 36px; line-height: 36px; border-radius: 50%; background: #fff; color: var(--ink); margin-right: 8px; }
.panel svg { display: block; margin: 0 auto; }
.sign { position: absolute; width: 318px; padding: 6px 14px 10px; background: rgba(20,28,40,.94); border-radius: 14px; color: #8be9ff; border: 4px solid currentColor; box-shadow: 0 0 16px currentColor; font-size: 28px; line-height: 1.45; }
.sign .sh { color: #fff; font-weight: 700; text-align: center; }
.sign .row { color: #fff; display: flex; align-items: center; gap: 12px; margin-top: 3px; }
.sign .bx { position: relative; flex: none; width: 32px; height: 32px; border: 3px solid #fff; border-radius: 6px; }
.sign .bx svg { position: absolute; left: -2px; top: -2px; width: 30px; height: 30px; }
.closing { position: absolute; left: 50%; bottom: 6px; translate: -50% 0; text-align: center; }
.closing div { margin: 0 auto 4px; width: max-content; white-space: nowrap; font-size: 28px; line-height: 38px; padding: 0 20px; border-radius: 10px; background: rgba(20,28,40,.92); }
.closing .last { color: #ffe066; font-weight: 700; }

/* ---------- แอนิเมชันกลาง ---------- */
.mv { transform: translate(var(--x0, 0px), var(--y0, 0px)); }
@keyframes m1 { from { transform: translate(var(--x0), var(--y0)); } to { transform: translate(var(--x1), var(--y1)); } }
@keyframes m2 { from { transform: translate(var(--x1), var(--y1)); } to { transform: translate(var(--x2), var(--y2)); } }
@keyframes m3 { from { transform: translate(var(--x2), var(--y2)); } to { transform: translate(var(--x3), var(--y3)); } }
@keyframes m4 { from { transform: translate(var(--x3), var(--y3)); } to { transform: translate(var(--x4), var(--y4)); } }
@keyframes m5 { from { transform: translate(var(--x4), var(--y4)); } to { transform: translate(var(--x5), var(--y5)); } }
@keyframes m6 { from { transform: translate(var(--x5), var(--y5)); } to { transform: translate(var(--x6), var(--y6)); } }
@keyframes fi { from { opacity: 0; } to { opacity: 1; } }
@keyframes fo { to { opacity: 0; } }
@keyframes dim { to { opacity: .5; } }
@keyframes dim2 { to { opacity: .25; } }
@keyframes undim { from { opacity: .5; } to { opacity: 1; } }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }
@keyframes hop { 0%, 100% { translate: 0 0; } 40% { translate: 0 -16px; } }
@keyframes swA { 0%, 100% { rotate: 0deg; } 25% { rotate: 16deg; } 75% { rotate: -16deg; } }
@keyframes swB { 0%, 100% { rotate: 0deg; } 25% { rotate: -16deg; } 75% { rotate: 16deg; } }
@keyframes shake { 0%, 100% { translate: 0 0; } 25% { translate: -5px 0; } 75% { translate: 5px 0; } }
@keyframes unrot { to { rotate: 0deg; } }
@keyframes toBlue { to { fill: #4aa8e8; } }
@keyframes toGreen { to { fill: #3ddc5f; } }
@keyframes toOrange { to { fill: #f28c28; } }
@keyframes lnG { to { stroke: #2fe05a; } }
@keyframes lnR { from { stroke: #2fe05a; } to { stroke: #ff4d4d; } }
@keyframes lnG2 { from { stroke: #ff4d4d; } to { stroke: #2fe05a; } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes tilt { to { rotate: -14deg; } }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
@keyframes capIn { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
@keyframes capUp { from { opacity: 1; transform: none; } to { opacity: .55; transform: translateY(-56px); } }
@keyframes capUpK { from { opacity: 1; transform: none; } to { opacity: 1; transform: translateY(-56px); } }
@keyframes capOut { from { opacity: .55; transform: translateY(-56px); } to { opacity: 0; transform: translateY(-92px); } }
@keyframes capOutA { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(-30px); } }
@keyframes mins { from { --m: 15; } to { --m: 0; } }
@keyframes secs { from { --s: 60; } to { --s: 0; } }
@keyframes tred { to { color: #ff6b6b; border-color: #ff6b6b; } }
@keyframes ripple { 0% { opacity: 0; transform: scale(.2); } 12% { opacity: .95; } 100% { opacity: 0; transform: scale(3.2); } }
@keyframes flash { 50% { stroke-width: 10; } }
@keyframes doorUp { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes dOpen { from { transform: scaleY(1); } to { transform: scaleY(.05); } }
@keyframes dClose { from { transform: scaleY(.05); } to { transform: scaleY(1); } }
@keyframes cG { from { color: #8be9ff; } to { color: #2fe05a; } }
@keyframes cC { from { color: #2fe05a; } to { color: #8be9ff; } }
@keyframes cR { from { color: #8be9ff; } to { color: #ff4d4d; } }
@keyframes gather { from { transform: translate(var(--fx), var(--fy)) scale(1.9); } to { transform: translate(0, 0) scale(1); } }
@keyframes spin { to { transform: rotate(1080deg); } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes bdBlink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

.ring { filter: drop-shadow(0 0 6px #ffe066); }
.door { fill: currentColor; filter: drop-shadow(0 0 10px currentColor); }
</style>
</head>
<body>
<div id="app">
  <div id="title"></div>
  <div id="stage"></div>
  <div id="credit">Aj. NesT the Series</div>
  <div id="nav"></div>
</div>

<script>
/* ===== ค่ากลาง ===== */
const C = { or: '#f28c28', bl: '#4aa8e8', gr: '#2fb24a', gr2: '#3ddc5f', rd: '#e03131', ink: '#1c2633', note: '#ffe066' };
const P = { po: '#1f3a6e', g: '#2f9e44', y: '#f2c230', r: '#e8504f', sm: '#8e5bd0' };
const FY = 520; // ระดับพื้นที่ทุกคนยืน — ระดับเดียวกันทุกบทบาท

const PB = [['ระบบแจ้งเตือน', 8], ['หน้าค้นหา', 13], ['รายงานสรุป', 18], ['แชตช่วยเหลือ', 13], ['ล็อกอินมือถือ', 8],
            ['ตะกร้าสินค้า', 21], ['ชำระเงินออนไลน์', 5], ['หน้าโปรไฟล์', 8], ['ส่งออก Excel', 3]];
const pslot = i => [495, 100 + i * 49];            // แถว Product Backlog กลางเวที
const cslot = i => [36, 112 + i * 49];             // Product Backlog ที่มุมจอ
const bslot = j => [790, 296 - j * 49];            // ช่องในกล่อง capacity
const slot = (c, i) => [612 + c * 213 + (i % 2) * 98, 142 + Math.floor(i / 2) * 52]; // ช่องบนบอร์ด

/* ===== ตัวช่วยสร้างชิ้นส่วน ===== */
function A(o) {
  const v = [], a = [];
  (o.p || []).forEach((s, i) => {
    v.push(`--x${i}:${s[0]}px;--y${i}:${s[1]}px`);
    if (i) a.push(`m${i} ${s[3] || 1.4}s ${s[4] || 'ease-in-out'} ${s[2]}s forwards`);
  });
  if (o.in != null) a.push(`fi ${o.ind || .8}s ease ${o.in}s both`);
  if (o.out != null) a.push(`fo ${o.outd || .8}s ease ${o.out}s forwards`);
  if (o.a) a.push(o.a);
  return `class="mv" style="${v.join(';')}${o.s ? ';' + o.s : ''}${a.length ? ';animation:' + a.join(',') : ''}"`;
}
const an = a => a.length ? ` style="animation:${a.join(',')}"` : '';

function person(col, p, o = {}) {
  const ba = [], la = [], lb = [];
  p.forEach((s, i) => {
    if (!i) return;
    const d = s[3] || 1.4, n = Math.max(2, Math.round(d / .5));
    ba.push(`bob .5s ease-in-out ${s[2]}s ${n}`);
    la.push(`swA .5s linear ${s[2]}s ${n}`);
    lb.push(`swB .5s linear ${s[2]}s ${n}`);
  });
  (o.hop || []).forEach(t => ba.push(`hop .6s ease-out ${t}s 1`));
  const folder = o.folder
    ? `<rect x="-47" y="-98" width="30" height="40" rx="3" fill="${C.or}" stroke="#b8650f" stroke-width="2"/><rect x="-47" y="-98" width="13" height="6" fill="#b8650f"/>` : '';
  return `<g ${A({ p, in: o.in, out: o.out })}><ellipse cx="0" cy="2" rx="32" ry="9" fill="rgba(0,0,0,.18)"/><g${an(ba)}>
    <g transform="translate(-9,-54)"><rect x="-7" y="0" width="14" height="54" rx="6" fill="#27303c"${an(la)}/></g>
    <g transform="translate(9,-54)"><rect x="-7" y="0" width="14" height="54" rx="6" fill="#27303c"${an(lb)}/></g>
    <rect x="-36" y="-118" width="12" height="50" rx="6" fill="${col}"/><rect x="24" y="-118" width="12" height="50" rx="6" fill="${col}"/>
    <rect x="-25" y="-122" width="50" height="74" rx="12" fill="${col}"/>
    <circle cx="0" cy="-142" r="17" fill="#ecd3bd"/>${folder}</g></g>`;
}

function card(o) {
  const w = o.w || 280, h = o.h || 44, tc = o.tc || C.ink;
  const rs = o.re ? ` style="animation:${o.re.map(r => `${r[0]} .6s ease ${r[1]}s forwards`).join(',')}"` : '';
  let t = '';
  if (o.txt != null) t += o.pts != null
    ? `<text x="12" y="${h / 2 + 10}" fill="${tc}">${o.txt}</text><text x="${w - 12}" y="${h / 2 + 10}" text-anchor="end" fill="${tc}">${o.pts}</text>`
    : `<text x="${w / 2}" y="${h / 2 + 10}" text-anchor="middle" fill="${tc}">${o.txt}</text>`;
  return `<g ${A(o)}><g${o.inner ? ` style="${o.inner}"` : ''}><rect width="${w}" height="${h}" rx="7" fill="${o.fill || C.or}" stroke="rgba(0,0,0,.28)" stroke-width="1.5"${rs}/>${t}</g></g>`;
}
const sc = (pts, o) => card(Object.assign({ w: 92, fill: C.bl, txt: pts }, o)); // การ์ดเล็กบนบอร์ด

const floor = `<polygon points="140,400 800,781 800,795 140,414" fill="#aeb7c2"/><polygon points="1460,400 800,781 800,795 1460,414" fill="#9aa4b0"/><polygon points="800,19 1460,400 800,781 140,400" fill="#dde2e8"/>`;
const legs = `<rect x="640" y="338" width="10" height="36" fill="#6b7785"/><rect x="1190" y="338" width="10" height="36" fill="#6b7785"/>`;
const board = legs + `<rect x="600" y="80" width="640" height="265" rx="10" fill="#f6f8fa" stroke="#6b7785" stroke-width="4"/>
  <line x1="813" y1="92" x2="813" y2="333" stroke="#c3cbd4" stroke-width="3"/><line x1="1026" y1="92" x2="1026" y2="333" stroke="#c3cbd4" stroke-width="3"/>
  <line x1="612" y1="132" x2="1228" y2="132" stroke="#c3cbd4" stroke-width="3"/>
  <text x="706" y="121" text-anchor="middle" fill="${C.ink}">To Do</text><text x="919" y="121" text-anchor="middle" fill="${C.ink}">In Progress</text><text x="1133" y="121" text-anchor="middle" fill="${C.ink}">Done</text>`;

function ring(t, extra) {
  const d = t == null ? '' : ` style="stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-in-out ${t}s forwards"`;
  return `<defs><mask id="rm" maskUnits="userSpaceOnUse" x="560" y="40" width="720" height="345"><rect x="588" y="68" width="664" height="289" rx="14" fill="none" stroke="#fff" stroke-width="16" pathLength="1"${d}/></mask></defs>
  <rect class="ring" mask="url(#rm)" x="588" y="68" width="664" height="289" rx="14" fill="none" stroke="#ffe066" stroke-width="4" stroke-dasharray="16 10"${extra ? ` style="animation:${extra}"` : ''}/>`;
}
function lock(t) {
  return `<g transform="translate(1252,68)"><g${t == null ? '' : ` style="animation:pop .8s cubic-bezier(.3,1.5,.5,1) ${t}s both"`}><circle r="24" fill="#ffe066" stroke="${C.ink}" stroke-width="3"/><rect x="-11" y="-4" width="22" height="17" rx="3" fill="${C.ink}"/><path d="M-7,-4 v-5 a7,7 0 0 1 14,0 v5" fill="none" stroke="${C.ink}" stroke-width="4"/></g></g>`;
}
function cube(a, c1 = '#249a3e', c2 = '#1d8434', c3 = '#46cf63', noTop) {
  const w = +(a * .866).toFixed(1), h = a / 2;
  return `<polygon points="0,0 ${-w},${-h} ${-w},${-h - a} 0,${-a}" fill="${c1}"/><polygon points="0,0 ${w},${-h} ${w},${-h - a} 0,${-a}" fill="${c2}"/>` +
    (noTop ? '' : `<polygon points="0,${-a} ${-w},${-h - a} 0,${-2 * h - a} ${w},${-h - a}" fill="${c3}"/>`);
}

const tag = (x, y, html, t, cls = '') => `<div class="tag ${cls}" style="left:${x}px;top:${y}px${t == null ? '' : `;animation:rise .9s ease ${t}s both`}">${html}</div>`;
function caps(list) {
  return list.map((c, i) => {
    const a = [`capIn .9s ease ${c[0]}s both`];
    if (list[i + 1]) a.push(`${c[2] ? 'capUpK' : 'capUp'} .9s ease ${list[i + 1][0]}s forwards`);
    if (list[i + 2]) a.push(`capOut .9s ease ${list[i + 2][0]}s forwards`);
    return `<div class="cap" style="animation:${a.join(',')}">${c[1]}</div>`;
  }).join('');
}
const S = (svg, html = '') => `<svg class="main" viewBox="0 0 1600 800">${floor}${svg}</svg>${html}`;
const crew = () => person(P.po, [[440, FY]], { folder: 1 }) + person(P.g, [[820, FY]]) + person(P.y, [[920, FY]]) + person(P.r, [[1020, FY]]) + person(P.sm, [[1190, FY]]);
const sbTag = tag(920, 22, 'Sprint Backlog'), pbTag = tag(176, 58, 'Product Backlog');
const cornerPB = (extra = () => ({})) => [5, 6, 7, 8].map((k, i) => card(Object.assign({ txt: PB[k][0], p: [cslot(i)], s: 'opacity:.5' }, extra(i)))).join('');

/* ===== 10 ฉาก ===== */
const SCENES = [

/* 1 */ { name: 'ตัวละคร 3 บทบาท', build: () => S(
  person(P.po, [[-120, FY], [440, FY, .5, 3]], { folder: 1 }) +
  person(P.g, [[1700, FY], [820, FY, 5.5, 3]]) + person(P.y, [[1800, FY], [920, FY, 5.7, 3]]) + person(P.r, [[1900, FY], [1020, FY, 5.9, 3]]) +
  person(P.sm, [[1760, FY], [1190, FY, 10.8, 2.6]]) +
  `<line x1="920" y1="240" x2="920" y2="336" stroke="${C.ink}" stroke-width="3" stroke-dasharray="6 6" style="animation:fi .8s ease 9.4s both"/>`,
  tag(440, 238, `<span class="chip" style="background:${P.po}">Product Owner</span><br>ตัดสินว่าอะไรสำคัญก่อนหลัง`, 3.6, 'two') +
  tag(920, 140, `<span class="chip" style="background:${P.g}">Developers</span><br>ตัดสินว่ารับงานได้เท่าไหร่ และลงมือทำ`, 9, 'two') +
  tag(1250, 238, `<span class="chip" style="background:${P.sm}">Scrum Master</span><br>ทำให้ทีมทำงานได้ ไม่ใช่สั่งว่าให้ทำอะไร`, 13.5, 'two') +
  caps([[16, '3 บทบาท ไม่ใช่ 3 ตำแหน่ง — คนเดียวอาจทำได้หลายบทบาท']])) },

/* 2 */ { name: 'Product Backlog', build: () => {
  const from = [[-320, 100], [700, -80], [1700, 150], [1700, 620], [900, 860], [-320, 650], [200, -80], [1300, -80]];
  const pile = [[450, 130], [560, 150], [480, 180], [590, 205], [455, 230], [540, 255], [470, 275], [585, 298]];
  const rot = [-14, 9, -6, 16, 11, -10, 5, -17];
  const txt = PB.filter((_, i) => i !== 3).map(x => x[0]);
  let cards = '';
  txt.forEach((t, i) => {
    const p = [from[i], [pile[i][0], pile[i][1], .5 + i * .45, 1.7, 'ease-out'], [...pslot(i), 7 + i * .42, 1.1]];
    if (i >= 3) p.push([...pslot(i + 1), 12.4, 1.1]);
    cards += card({ txt: t, p, inner: `rotate:${rot[i]}deg;animation:unrot 1s ease ${7 + i * .42}s forwards` });
  });
  cards += card({ txt: PB[3][0], p: [[1700, 247], [830, 247, 11.6, 1.6, 'ease-out'], [...pslot(3), 13.4, 1.3]] });
  return S(
    person(P.po, [[440, FY], [468, FY, 6, .8], [440, FY, 11, .8]], { folder: 1, hop: [7.4, 8.6, 9.8] }) +
    person(P.g, [[820, FY]]) + person(P.y, [[920, FY]]) + person(P.r, [[1020, FY]]) + person(P.sm, [[1190, FY]]) + cards,
    tag(635, 46, 'Product Backlog', 15.4) +
    caps([[2.5, 'ความต้องการเข้ามาจากทุกทิศ'], [7.2, 'Product Owner เรียงลำดับ — บนสุดคือสำคัญที่สุด'], [13.6, 'Product Backlog เปลี่ยนได้ตลอดเวลา ไม่มีวันปิด']]));
} },

/* 3 */ { name: 'Sprint Planning', build: () => {
  let cards = '';
  PB.forEach((c, i) => {
    const o = { txt: c[0], pts: c[1], p: [pslot(i)] };
    if (i < 5) { const t = 3.5 + i * 1.5; o.p.push([...bslot(i), t, 1.2]); o.re = [['toBlue', t + .9]]; o.inner = 'animation:shake .3s ease-in-out 13.8s 4'; }
    if (i === 5) { o.p.push([790, 50, 12, 1.8], [...pslot(5), 15.2, 2.6]); o.inner = 'animation:shake .3s ease-in-out 13.8s 4'; }
    cards += card(o);
  });

     <div class="cap" style="animation:capIn .9s ease 10s both,capOutA .8s ease 13.1s forwards">ความยาวของรอบไม่เปลี่ยน — สิ่งที่เปลี่ยนคือสิ่งที่ใส่เข้าไป</div>
     <div class="closing">` +
    cl(13.8, '<b>3 Artifacts:</b> Product Backlog · Sprint Backlog · Increment') +
    cl(15.2, '<b>5 Events:</b> Sprint · Planning · Daily Scrum · Review · Retrospective') +
    cl(16.6, '<b>3 Accountabilities:</b> Product Owner · Developers · Scrum Master') +
    cl(18, 'เท่านี้ ไม่มีอะไรมากกว่านี้', 'last') + `</div>`);
} }
];

/* ===== ตัวควบคุมฉาก ===== */
const stage = document.getElementById('stage'), title = document.getElementById('title'), nav = document.getElementById('nav'), app = document.getElementById('app');
const seen = new Set();
let cur = 0;

SCENES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'num'; b.textContent = i + 1; b.title = s.name;
  b.onclick = () => { show(i); b.blur(); };
  nav.appendChild(b);
});
nav.insertAdjacentHTML('beforeend', '<span class="sp"></span><button class="act" id="bR">เล่นซ้ำ</button><button class="act" id="bP">ย้อนกลับ</button><button class="act" id="bN">ถัดไป</button>');
const nums = [...nav.querySelectorAll('.num')];

function show(i) {
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  seen.add(cur);
  stage.innerHTML = SCENES[cur].build();   // สร้างใหม่ทุกครั้ง = แอนิเมชันเริ่มจากต้น แล้วค้างภาพสุดท้าย
  title.innerHTML = `<span class="no">${cur + 1} / ${SCENES.length}</span>${SCENES[cur].name}`;
  nums.forEach((b, k) => { b.classList.toggle('cur', k === cur); b.classList.toggle('seen', k !== cur && seen.has(k)); });
}
document.getElementById('bR').onclick = e => { show(cur); e.currentTarget.blur(); };
document.getElementById('bP').onclick = e => { show(cur - 1); e.currentTarget.blur(); };
document.getElementById('bN').onclick = e => { show(cur + 1); e.currentTarget.blur(); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); show(cur); }
  else if (e.key === 'ArrowRight') { e.preventDefault(); show(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); show(cur - 1); }
});
function fit() { app.style.transform = `translate(-50%,-50%) scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener('resize', fit);
fit();
show(0);
</script>
